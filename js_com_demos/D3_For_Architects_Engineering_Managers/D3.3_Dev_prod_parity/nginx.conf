worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

# js_preprocess runs gen.js at parse time — before any http{} block exists.
# gen.js reads APP_ENV and emits a complete http{} block tailored to the
# target environment (dev on 8184 with verbose errors, prod on 8185 minimal).
js_preprocess     gen.js;

events {
    worker_connections  256;
}
