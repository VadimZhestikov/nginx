worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8183;
        server_name  localhost;

        # Main API endpoint — enhanced by installed plugins
        location /api/ { }

        # Lists installed plugins and their metadata
        location /plugins/ { }

        # Metrics exposed by the rate-limit plugin
        location /metrics/ { }
    }
}
