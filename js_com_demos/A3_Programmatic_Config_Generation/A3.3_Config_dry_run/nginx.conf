worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8120;
        server_name  app.local;

        # Production-like location tree — the /match/ endpoint lets you
        # simulate which location would handle a given URI.
        location = /health         { }
        location ^~ /static/       { }
        location /api/v1/          { }
        location /api/v2/          { }
        location /api/             { }
        location /admin/           { }
        location /                 { }

        # The dry-run endpoint itself
        location /match/           { }
    }
}
