worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    # In a real SSL rotation demo this server would have:
    #   listen 8100 ssl;
    #   ssl_certificate     /path/to/initial.crt;
    #   ssl_certificate_key /path/to/initial.key;
    # The handler.js shows how server.ssl.setCertificate(certPEM, keyPEM)
    # swaps the certificate live without reloading nginx.

    server {
        listen       8101;
        server_name  localhost;

        # Admin endpoint — POST here to trigger a certificate rotation
        location /admin/cert/ { }

        # Status endpoint — shows which "cert version" is active
        location /status/ { }
    }
}
