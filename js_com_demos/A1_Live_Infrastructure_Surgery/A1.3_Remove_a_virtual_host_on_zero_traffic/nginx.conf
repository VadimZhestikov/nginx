worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    # Primary server that hosts the admin endpoints
    server {
        listen       8105;
        server_name  primary.local;

        location /create/  { }
        location /remove/  { }
        location /count/   { }
        location /traffic/ { }
    }

    # Second static server so nginx builds a vhost dispatch hash
    server {
        listen       8105;
        server_name  anchor.local;

        location /ping/ { }
    }
}
