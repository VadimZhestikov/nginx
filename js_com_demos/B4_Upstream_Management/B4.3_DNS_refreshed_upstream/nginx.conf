worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  application/json;

    server {
        listen       8147;
        server_name  localhost;

        # Reports the most-recently resolved addresses held by the SharedWorker
        location /dns-status/ { }

        # Admin: trigger a simulated DNS re-resolution
        location /admin/refresh/ { }
    }
}
