worker_processes  4;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    upstream demo_backend {
        zone demo_backend 64k;
        server 127.0.0.1:9991;
        server 127.0.0.1:9992;
    }

    server {
        listen       8135 reuseport;
        server_name  localhost;

        location = /                  { }   # the single-page console
        location = /c/snapshots       { }
        location = /c/snapshot        { }
        location = /c/snapshot/create { }
        location = /c/raw             { }
        location = /c/state           { }
        location = /c/converge        { }
        location = /c/apply           { }
        location = /c/rollback        { }
        location = /c/squash          { }
        location = /worker            { }

        location /api/   { }                # managed-prop target (addHeaders)
        location /admin/ { }                # admin plugin's own REST (bonus)
    }
}
