<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nginx COM — Admin Console</title>
<style>
  body { font: 14px/1.45 system-ui, sans-serif; margin: 0; color: #1f2328;
         background: #fff; }
  header { padding: 14px 20px; border-bottom: 1px solid #d0d7de;
           display: flex; align-items: baseline; gap: 14px; }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: #57606a; font-size: 13px; }
  main { display: grid; grid-template-columns: 240px 1fr 280px; gap: 0;
         height: calc(100vh - 52px); }
  .col { overflow: auto; padding: 14px 16px; }
  .col + .col { border-left: 1px solid #eaeef2; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
       color: #57606a; margin: 0 0 10px; }
  .snap { padding: 7px 9px; border-radius: 6px; cursor: pointer;
          font-family: ui-monospace, monospace; font-size: 13px;
          display: flex; align-items: center; gap: 6px; }
  .snap:hover { background: #f6f8fa; }
  .snap.sel { background: #ddf4ff; }
  .snap.desired::after { content: '★'; color: #bf8700; margin-left: auto; }
  .op { display: grid; grid-template-columns: 18px 1fr auto auto;
        gap: 8px; align-items: center; padding: 6px 8px;
        border-bottom: 1px solid #f0f2f4; font-size: 13px; }
  .op .lbl { font-family: ui-monospace, monospace; }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .safe         { background: #1a7f37; }
  .guarded      { background: #9a6700; }
  .irreversible { background: #cf222e; }
  .tag { font-size: 11px; color: #57606a; }
  .note { grid-column: 2 / -1; color: #9a6700; font-size: 11px; }
  button { font: inherit; padding: 5px 11px; border: 1px solid #d0d7de;
           border-radius: 6px; background: #f6f8fa; cursor: pointer; }
  button:hover { background: #eef1f4; }
  button.primary { background: #1f883d; color: #fff; border-color: #1a7f37; }
  button.danger  { background: #cf222e; color: #fff; border-color: #a40e26; }
  .bar { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  .wk { display: flex; align-items: center; gap: 8px; padding: 5px 8px;
        border-radius: 6px; font-family: ui-monospace, monospace; font-size: 13px; }
  .wk.ok  { background: #eaffea; }
  .wk.lag { background: #fff1e5; }
  .pill { font-size: 11px; padding: 1px 7px; border-radius: 10px;
          background: #eaeef2; }
  pre { background: #f6f8fa; padding: 10px; border-radius: 6px; overflow: auto;
        font-size: 12px; }
  .msg { font-size: 12px; color: #57606a; min-height: 16px; }
</style>
</head>
<body>
<header>
  <h1>nginx COM — Admin Console</h1>
  <span class="sub">snapshots · safety classes · cross-worker convergence</span>
  <span class="sub" id="dot-legend">
    <span class="dot safe" style="display:inline-block"></span> safe
    &nbsp;<span class="dot guarded" style="display:inline-block"></span> guarded
    &nbsp;<span class="dot irreversible" style="display:inline-block"></span> irreversible
  </span>
</header>
<main>
  <div class="col">
    <h2>Snapshots</h2>
    <div id="snaps"></div>
    <div class="bar">
      <button id="btn-squash">Squash selected</button>
      <button id="btn-rollback" class="danger">Rollback</button>
    </div>
  </div>

  <div class="col">
    <h2>Snapshot detail <span id="sel-id" class="pill"></span></h2>
    <div id="ops"></div>
    <div class="bar">
      <button id="btn-apply" class="primary" disabled>Apply</button>
      <span class="msg" id="apply-msg"></span>
    </div>
  </div>

  <div class="col">
    <h2>Worker convergence</h2>
    <div class="msg">desired: <b id="desired">—</b></div>
    <div id="workers"></div>
    <h2 style="margin-top:18px">Live state</h2>
    <pre id="state">…</pre>
  </div>
</main>

<script>
var sel = null;            // selected snapshot id
var selected = {};         // multi-select for squash

function j(url, opts) {
  return fetch(url, opts || {}).then(function (r) {
    return r.json().then(function (b) { return { status: r.status, body: b }; });
  });
}

function renderSnaps() {
  return j('/c/snapshots').then(function (res) {
    var d = res.body;
    document.getElementById('desired').textContent = d.desired;
    var box = document.getElementById('snaps');
    box.innerHTML = '';
    d.snapshots.forEach(function (id) {
      var el = document.createElement('div');
      el.className = 'snap' + (id === sel ? ' sel' : '')
                   + (id === d.desired ? ' desired' : '');
      var cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = !!selected[id];
      cb.onclick = function (e) { e.stopPropagation();
        if (cb.checked) { selected[id] = 1; } else { delete selected[id]; } };
      var lbl = document.createElement('span'); lbl.textContent = id;
      el.appendChild(cb); el.appendChild(lbl);
      el.onclick = function () { sel = id; renderSnaps(); renderOps(); };
      box.appendChild(el);
    });
  });
}

function renderOps() {
  document.getElementById('sel-id').textContent = sel || '';
  var box = document.getElementById('ops');
  var applyBtn = document.getElementById('btn-apply');
  document.getElementById('apply-msg').textContent = '';
  if (!sel) { box.innerHTML = '<div class="msg">select a snapshot</div>';
              applyBtn.disabled = true; return; }
  return j('/c/snapshot?id=' + encodeURIComponent(sel)).then(function (res) {
    box.innerHTML = '';
    (res.body.ops || []).forEach(function (a) {
      var row = document.createElement('div'); row.className = 'op';
      var dot = document.createElement('span');
      dot.className = 'dot ' + a['class'];
      var lbl = document.createElement('span');
      lbl.className = 'lbl'; lbl.textContent = a.label;
      var cls = document.createElement('span');
      cls.className = 'tag'; cls.textContent = a['class'];
      var prop = document.createElement('span');
      prop.className = 'tag'; prop.textContent = a.propagation;
      row.appendChild(dot); row.appendChild(lbl);
      row.appendChild(cls); row.appendChild(prop);
      if (a.note) { var n = document.createElement('div');
        n.className = 'note'; n.textContent = a.note; row.appendChild(n); }
      box.appendChild(row);
    });
    applyBtn.disabled = false;
  });
}

function apply(confirm) {
  var url = '/c/apply?id=' + encodeURIComponent(sel) + (confirm ? '&confirm=1' : '');
  return j(url, { method: 'POST' }).then(function (res) {
    var msg = document.getElementById('apply-msg');
    if (res.status === 409) {
      if (window.confirm('This snapshot contains IRREVERSIBLE ops:\n\n'
            + res.body.ops.join('\n') + '\n\nApply anyway?')) {
        return apply(true);
      }
      msg.textContent = 'apply cancelled (irreversible ops)';
      return;
    }
    if (res.status === 200) { msg.textContent = 'applied ' + res.body.applied; }
    else { msg.textContent = 'error: ' + (res.body.error || res.status); }
    refresh();
  });
}

function renderConverge() {
  return j('/c/converge').then(function (res) {
    var box = document.getElementById('workers'); box.innerHTML = '';
    res.body.workers.forEach(function (w) {
      var el = document.createElement('div');
      el.className = 'wk ' + (w.converged ? 'ok' : 'lag');
      el.textContent = 'worker ' + w.idx + ' @ ' + w.at
                     + (w.converged ? '  ✓' : '  ⟳ lagging');
      box.appendChild(el);
    });
    if (!res.body.workers.length) {
      box.innerHTML = '<div class="msg">no stamps yet — apply a snapshot</div>';
    }
  });
}

function renderState() {
  return j('/c/state').then(function (res) {
    document.getElementById('state').textContent =
        JSON.stringify(res.body, null, 1);
  });
}

function refresh() {
  renderSnaps(); renderOps(); renderConverge(); renderState();
}

document.getElementById('btn-apply').onclick = function () { apply(false); };
document.getElementById('btn-rollback').onclick = function () {
  j('/c/rollback', { method: 'POST' }).then(refresh);
};
document.getElementById('btn-squash').onclick = function () {
  var ids = Object.keys(selected);
  if (ids.length < 2) { alert('select 2+ snapshots to squash'); return; }
  var name = prompt('name for the squashed snapshot:', 'squashed');
  if (!name) { return; }
  j('/c/squash?ids=' + ids.join(',') + '&name=' + encodeURIComponent(name),
    { method: 'POST' }).then(function () { selected = {}; refresh(); });
};

refresh();
setInterval(renderConverge, 2000);   // live convergence polling
</script>
</body>
</html>
