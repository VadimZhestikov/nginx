worker_processes  2;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8179;
        server_name  localhost;

        # Protected API endpoint — consumes one token per call
        location /api/ { }

        # Admin: refill the token bucket to its maximum capacity
        location /admin/refill/ { }

        # Status: how many tokens remain
        location /status/ { }
    }
}
