worker_processes  2;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8108;
        server_name  localhost;

        location /hit/   { }
        location /count/ { }
        location /reset/ { }
    }
}
