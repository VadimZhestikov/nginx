worker_processes  4;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8115 reuseport;
        server_name  localhost;

        location /admin/add-route/    { }
        location /admin/remove-route/ { }
        location /status/             { }

        # /api/v2/ exists in the config but is gated by a shared-memory flag.
        # POST /admin/add-route/ sets the flag; POST /admin/remove-route/ clears it.
        # All four workers see the change immediately via nginx.shared.
        location /api/v2/             { }
    }
}
