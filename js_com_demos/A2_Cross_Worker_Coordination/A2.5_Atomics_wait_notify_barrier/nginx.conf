worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8114;
        server_name  localhost;

        location /compute/  { }
        location /status/   { }
        location /stop-sw/  { }
    }
}
