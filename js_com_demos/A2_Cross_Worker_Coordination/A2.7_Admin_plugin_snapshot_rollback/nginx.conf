worker_processes  4;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    # Demo upstream — peer weights are used in {prop} snapshot tests
    upstream demo_backend {
        server 127.0.0.1:8091 weight=5;
        server 127.0.0.1:8092 weight=3;
    }

    server {
        # reuseport lets the OS distribute connections evenly across all 4
        # workers so the test can observe all four PIDs in a short request run.
        listen       8116 reuseport;
        server_name  localhost;

        # Admin plugin REST API
        location /admin/  { }

        # Application routes — handlers installed by nginx.broadcast() in handler.js;
        # behaviour is gated by nginx.shared flags written via the admin API.
        location /api/products/ { }
        location /api/premium/  { }
        location /api/          { }
        location /status/       { }
    }
}
