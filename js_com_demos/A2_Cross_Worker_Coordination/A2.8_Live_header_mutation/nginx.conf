worker_processes  4;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8117 reuseport;
        server_name  localhost;

        location /                  { }   # browser UI (served inline by JS)
        location /ws/               { }   # WebSocket — upgrade + message loop
        location /api/              { }   # echoes X-Api-Header in response
        location /status/           { }   # current shared state
        location /admin/set-header/ { }   # POST ?value=<new>  — no reload needed

        # ── Part 2: config-level add_header mutation ───────────────────────
        #
        # /plain/ has NO JS content handler.  nginx responds with a fixed
        # string from the rewrite module.  There is no loc.handler = fn here.
        # This is the "witness" location: headers injected via the COM API
        # appear here without any JS involvement in request handling.
        location /plain/ {
            return 200 "nginx plain response — no JS handler\n";
        }
        location /admin/add-config-header/    { }   # addHeader on /plain/
        location /admin/remove-config-header/ { }   # removeHeader on /plain/
        location /admin/clear-config-headers/ { }   # addHeaders = [] on /plain/
        location /admin/get-config-headers/   { }   # read current list
    }
}
