worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8190;
        server_name  localhost;

        # Public endpoint — routes based on X-Protocol header
        location /connect/ { }

        # Internal backend simulations
        location /internal/ssh-backend/    { }
        location /internal/https-backend/  { }
        location /internal/http-backend/   { }
        location /internal/unknown/        { }

        # Status — shows routing table and stats
        location /status/ { }
    }
}
