worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;
js_source         handler.js;

events { worker_connections 256; }

http {
    default_type  application/json;

    server {
        listen       8171;
        server_name  localhost;

        location /api/    { }
        location /plugins/ { }
        location /admin/load-plugin/ { }
    }
}
