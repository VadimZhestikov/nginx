worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8133;
        server_name  localhost;

        # GraphQL-style entry point — reads body, routes to right internal handler
        location /graphql/ { }

        # Internal operation handlers — not reachable from outside
        location /internal/users/   { internal; }
        location /internal/orders/  { internal; }
    }
}
