worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8130;
        server_name  localhost;

        # Entry point — handler inspects headers and routes internally
        location /route/ { }

        # Internal simulated backends — not reachable from outside
        location /internal/json/ { internal; }
        location /internal/html/ { internal; }
    }
}
