# COMCON dogfood — increment A acceptance.
#
# A confined tenant serves real HTTP traffic across multiple workers:
#  - deny-by-default environment (no `nginx`, no dangerous constructors),
#  - a granted host socket the tenant HOLDS but cannot walk (A1 reach gate),
#  - request headers in as data, response headers out via the return value
#    (A3.1) with CRLF-injection dropped,
#  - the host reads nginx.tenantDenials() to close the audit→enforce loop.
#
# Default mode is ENFORCE. Flip to `js_tenant_mode audit;` to watch the same
# reach be logged-and-allowed instead.

worker_processes 2;
error_log logs/error.log notice;
pid logs/nginx.pid;

js_source        host.js;          # HOST_ROOT: sets up + grants + /denials
js_tenant_source tenant.js;        # the confined mirror policy (compartment 1)

events { worker_connections 256; }

http {
    server {
        listen 127.0.0.1:8119;

        # The caged tenant serves these.
        location /mirror  { js_tenant_handler; }

        # Host-owned observability (reads the tenant's denial counters).
        location /denials { }
    }
}
