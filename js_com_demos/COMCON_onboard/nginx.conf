# COMCON onboarding demo — learn mode + generated grant stub.
#
# Run the tenant in LEARN mode, drive some traffic, then GET /contract to read
# the generated onboarding stub (what to grant, what to refuse, the enforce
# step). Flip js_tenant_mode to enforce once the environment is settled.

worker_processes 1;
error_log logs/error.log notice;
pid logs/nginx.pid;

js_tenant_mode   learn;
js_source        host.js;      # imports onboard.js; serves /contract
js_tenant_source tenant.js;    # written against too much host surface

events { worker_connections 64; }

http {
    server {
        listen 127.0.0.1:8120;

        location /go       { js_tenant_handler; }   # drives the tenant
        location /contract { }                       # host: the generated stub
    }
}
