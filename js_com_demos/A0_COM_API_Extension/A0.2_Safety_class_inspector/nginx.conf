worker_processes  2;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    # Zone-backed upstream → peer scalar writes are cross-worker (zoned-shared).
    upstream zoned {
        zone zoned 64k;
        server 127.0.0.1:9991;
        server 127.0.0.1:9992;
    }

    # Plain upstream → peer scalar writes are worker-local (need fan-out).
    upstream plain {
        server 127.0.0.1:9993;
    }

    server {
        listen       8132 reuseport;
        server_name  localhost;

        # Safety-class inspector endpoints (installed by handler.js).
        location = /            { }   # HTML traffic-light report
        location = /catalog     { }   # JSON discovery root (nginx.describe())
        location = /inspect     { }   # JSON report
        location = /inspect/sum { }   # JSON summary counts

        # A proxied location so proxy.* members appear in the walk.
        location /p/ {
            proxy_pass http://zoned;
        }
    }
}
