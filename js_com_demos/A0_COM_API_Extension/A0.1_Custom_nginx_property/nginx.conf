worker_processes  4;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8099 reuseport;
        server_name  localhost;

        # Feature-flag REST API — handled by the nginx.featureFlags extension.
        # Prefix match: also handles /flags/enable/ and /flags/disable/.
        location /flags/  { }

        # App endpoint gated by the new-checkout flag.
        location /api/    { }
    }
}
