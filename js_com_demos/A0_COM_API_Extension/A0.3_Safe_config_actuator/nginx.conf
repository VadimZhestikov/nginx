worker_processes  4;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    # Zone-backed → peer scalar writes are cross-worker (zoned-shared, no fan-out).
    upstream zoned {
        zone zoned 64k;
        server 127.0.0.1:9991;
        server 127.0.0.1:9992;
    }

    server {
        listen       8134 reuseport;
        server_name  localhost;

        # Actuator REST endpoints (installed by handler.js via nginx.safeConfig).
        location = /plan      { }   # GET  dry-run plan for ?path=&value=
        location = /canary    { }   # POST ?pct=N        canaryWeight
        location = /header    { }   # POST ?key=&value=  setResponseHeader on /app/
        location = /toggle    { }   # POST ?on=0|1       toggleLocation /app/
        location = /drain     { }   # POST ?addr=        drainPeer
        location = /gate-demo { }   # GET  shows a guarded write rejected then accepted
        location = /weights   { }   # GET  responding worker pid + zoned peer weights
        location = /worker    { }   # GET  responding worker pid

        # App route used to observe header / toggle propagation across workers.
        location = /app       { }
    }
}
