worker_processes 4;
daemon on;
error_log /home/zhestikov/tableA/dir_err.log crit;
pid /home/zhestikov/tableA/dir.pid;
events { worker_connections 8192; }
http {
  access_log off;
  default_type text/plain;
  map $http_x_tenant $tenant_seen { ""  "-"; default $http_x_tenant; }
  server {
    listen 8080 reuseport;
    location / { add_header x-tenant-seen $tenant_seen always; return 200 "ok\n"; }
  }
}
