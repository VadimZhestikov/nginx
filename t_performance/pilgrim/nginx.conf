worker_processes  4;
pid               logs/nginx.pid;
error_log         logs/error.log  error;
js_source         handler.js;

events {
    worker_connections  1024;
}

http {
    access_log   off;
    default_type text/plain;

    server {
        listen  9001 reuseport;
        server_name perf;

        # Pure nginx — no JS execution per request
        location /baseline { return 200 "ok\n"; }

        # Empty JS handler — measures JS entry/exit overhead
        location /empty    { }

        # Headers handler — measures JS + request-object property access
        location /headers  { }
    }
}
