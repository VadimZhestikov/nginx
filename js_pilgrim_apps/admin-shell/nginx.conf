# nginx.conf — admin-shell reference configuration
#
# Serves the browser UI at /admin/ and the WebSocket endpoint at /admin/ws.
# Load the plugin with:
#   js_source /path/to/init.js;   (or inline)
# where init.js contains:
#   nginx.use('/path/to/js_pilgrim_apps/admin-shell');
#
# Security: bind the admin server to 127.0.0.1 or protect it with
# a firewall rule / basic-auth before exposing in production.

worker_processes auto;

js_source conf/init.js;

events { }

http {
    include      mime.types;
    default_type application/octet-stream;

    # Upstream backend pool (optional — demo for upstreams.list)
    upstream backend {
        server 127.0.0.1:8091 weight=5;
        server 127.0.0.1:8092 weight=3;
    }

    server {
        listen      127.0.0.1:8080;
        server_name localhost;

        # Static browser UI
        location /admin/ {
            root conf;          # serves conf/static/index.html
            try_files $uri $uri/ /admin/index.html;
        }

        # WebSocket JSON-RPC endpoint
        location /admin/ws {
            # No proxy_pass — the JS handler hijacks the connection directly.
        }

        # Proxy to backend pool (demo)
        location /api/ {
            proxy_pass http://backend;
        }
    }
}
