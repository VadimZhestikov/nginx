# ============================================================
# admin_UI_demo_v2 — nginx JS Admin Shell v2
#
# Run from the repository root:
#
#   objs/nginx -p . -c js_pilgrim_apps/admin_UI_demo_v2/nginx.conf
#
# Then open:
#   http://<host>:8080/    — demo v2 UI (tree browser + per-worker REPL)
# ============================================================

worker_processes 4;

js_source init.js;

error_log  js_pilgrim_apps/admin_UI_demo_v2/logs/error.log  notice;
pid        js_pilgrim_apps/admin_UI_demo_v2/logs/nginx.pid;

events {
    worker_connections 256;
}

http {
    include      ../../conf/mime.types;
    default_type application/octet-stream;

    access_log js_pilgrim_apps/admin_UI_demo_v2/logs/access.log;

    upstream web_backend {
        server 127.0.0.1:8091 weight=5;
        server 127.0.0.1:8092 weight=3;
        server 127.0.0.1:8093 weight=2 backup;
    }

    upstream api_backend {
        server 127.0.0.1:8094 weight=10;
        server 127.0.0.1:8095 weight=5  max_fails=3 fail_timeout=30s;
    }

    upstream cache_backend {
        server 127.0.0.1:8096;
    }

    server {
        listen      8080;
        server_name localhost;

        location / {
            root  js_pilgrim_apps/admin_UI_demo_v2/static;
            index index.html;
        }

        location /admin/ {
            alias js_pilgrim_apps/admin-shell/static/;
            try_files $uri $uri/ /admin/index.html;
        }

        location /admin/ws {
        }

        location /info {
        }

        location /health {
        }

        location /web/ {
            proxy_pass http://web_backend/;
        }

        location /api/ {
            proxy_pass http://api_backend/;
        }

        location /cache/ {
            proxy_pass http://cache_backend/;
        }
    }
}
