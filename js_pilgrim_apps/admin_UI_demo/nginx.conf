# ============================================================
# admin_UI_demo — nginx JS Admin Shell demo
#
# Run from the repository root:
#
#   objs/nginx -p . -c js_pilgrim_apps/admin_UI_demo/nginx.conf
#
# Then open:
#   http://localhost:8080/          — demo landing page
#   http://localhost:8080/admin/    — admin shell UI
# ============================================================

worker_processes 2;

js_source init.js;

error_log  js_pilgrim_apps/admin_UI_demo/logs/error.log  notice;
pid        js_pilgrim_apps/admin_UI_demo/logs/nginx.pid;

events {
    worker_connections 256;
}

http {
    include      ../../conf/mime.types;
    default_type application/octet-stream;

    access_log js_pilgrim_apps/admin_UI_demo/logs/access.log;

    # --------------------------------------------------------
    # Sample upstream pools (backends are illustrative;
    # they don't need to be running for the admin UI to work)
    # --------------------------------------------------------

    upstream web_backend {
        server 127.0.0.1:8091 weight=5;
        server 127.0.0.1:8092 weight=3;
        server 127.0.0.1:8093 weight=2 backup;
    }

    upstream api_backend {
        server 127.0.0.1:8094 weight=10;
        server 127.0.0.1:8095 weight=5  max_fails=3 fail_timeout=30s;
    }

    upstream cache_backend {
        server 127.0.0.1:8096;
    }

    # --------------------------------------------------------
    # Main server
    # --------------------------------------------------------

    server {
        listen      8080;
        server_name localhost;

        # Demo landing page
        location / {
            root  js_pilgrim_apps/admin_UI_demo/static;
            index index.html;
        }

        # Admin shell — static UI (served from admin-shell package)
        location /admin/ {
            alias js_pilgrim_apps/admin-shell/static/;
            try_files $uri $uri/ /admin/index.html;
        }

        # Admin shell — WebSocket JSON-RPC endpoint
        # (handler installed by admin-shell.js at startup)
        location /admin/ws {
        }

        # Info endpoint — returns runtime stats as JSON
        # (handler installed by init.js)
        location /info {
        }

        # Health check
        location /health {
        }

        # Proxied routes (backends are illustrative)
        location /web/ {
            proxy_pass http://web_backend/;
        }

        location /api/ {
            proxy_pass http://api_backend/;
        }

        location /cache/ {
            proxy_pass http://cache_backend/;
        }
    }
}
