# Zero-Trust API Gateway — reference nginx.conf
#
# Adjust paths, ports, and upstream addresses for your environment.
# See js_pilgrim_apps/zero-trust-gateway/README.adoc for full documentation.

worker_processes  auto;

error_log  /var/log/nginx/gateway-error.log  notice;
pid        /var/run/nginx-gateway.pid;

js_source  /etc/nginx/gateway.js;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile   on;
    keepalive_timeout  65;

    # ---------------------------------------------------------------
    # Upstream backend pool
    # ---------------------------------------------------------------
    upstream api_backend {
        server  127.0.0.1:9000;
        keepalive 16;
    }

    # ---------------------------------------------------------------
    # Gateway virtual server
    #
    # server_name must be 'gateway' so gateway.js can find it via
    # nginx.http.servers.find(s => s.name === 'gateway').
    # ---------------------------------------------------------------
    server {
        listen       80;
        server_name  gateway;

        # Health check — no auth, no proxy
        location /healthz {
            # handler assigned by gateway.js
        }

        # Runtime status — cross-worker counters
        location /status {
            # handler assigned by gateway.js
        }

        # All API traffic — proxy to backend pool
        location /api/ {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   Connection        "";

            # Gateway adds its own Cache-Control; suppress nginx default
            proxy_hide_header  Cache-Control;
        }
    }
}
