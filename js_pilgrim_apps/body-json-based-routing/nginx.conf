# Body JSON Router — reference nginx.conf
#
# Adjust paths, ports, upstream addresses, and routing rules in router.js
# for your environment.
# See js_pilgrim_apps/body-json-based-routing/README.adoc for full docs.

worker_processes  auto;

error_log  /var/log/nginx/router-error.log  notice;
pid        /var/run/nginx-router.pid;

js_source  /etc/nginx/router.js;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    sendfile   on;
    keepalive_timeout  65;

    # ---------------------------------------------------------------
    # Upstream backend pools — one group per routing destination.
    # Add keepalive for production HTTP/1.1 reuse.
    # ---------------------------------------------------------------
    upstream payments-eu  { server 10.0.1.10:8080; keepalive 16; }
    upstream payments-us  { server 10.0.1.11:8080; keepalive 16; }
    upstream analytics    { server 10.0.2.10:8080; keepalive 16; }
    upstream default-pool { server 10.0.3.10:8080; keepalive 16; }

    # ---------------------------------------------------------------
    # Router virtual server
    #
    # server_name must be 'router' so router.js can find it via
    # nginx.http.servers (falls back to servers[0] if absent).
    # ---------------------------------------------------------------
    server {
        listen       80;
        server_name  router;

        # Public entry-point.  JS reads the body, extracts routing
        # fields, and issues a subrequest to one of the /internal/*
        # locations below.
        location /route/ {
            # Enforce a hard cap to protect against runaway uploads.
            # X-Forwarded-Body forwarding is reliable up to this limit.
            client_max_body_size  8k;

            # Content handler assigned by router.js
        }

        # ----------------------------------------------------------
        # Internal relay locations — one per upstream pool.
        # Not reachable from outside nginx (internal; directive).
        # proxy_pass strips /internal/<pool>/ and forwards to the pool.
        # ----------------------------------------------------------
        location /internal/payments-eu/ {
            internal;
            proxy_pass         http://payments-eu/;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Body  $http_x_forwarded_body;
            proxy_set_header   X-Original-URI    $http_x_original_uri;
        }

        location /internal/payments-us/ {
            internal;
            proxy_pass         http://payments-us/;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Body  $http_x_forwarded_body;
            proxy_set_header   X-Original-URI    $http_x_original_uri;
        }

        location /internal/analytics/ {
            internal;
            proxy_pass         http://analytics/;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Body  $http_x_forwarded_body;
            proxy_set_header   X-Original-URI    $http_x_original_uri;
        }

        location /internal/default/ {
            internal;
            proxy_pass         http://default-pool/;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Body  $http_x_forwarded_body;
            proxy_set_header   X-Original-URI    $http_x_original_uri;
        }
    }
}
