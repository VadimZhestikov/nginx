worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

# framework first (publishes globalThis.mirror), then the app rule
js_source         ../lib/mirror.js;
js_source         app.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8300;
        server_name  mirror-demo;

        location / { }
    }

    # HTTPS server for the onClientHello (TLS ClientHello) rule.
    # cert.pem / key.pem are generated by test.sh.
    server {
        listen       8343 ssl;
        server_name  mirror-tls;

        ssl_certificate      cert.pem;
        ssl_certificate_key  key.pem;

        location / { }
    }
}
