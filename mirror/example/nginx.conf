worker_processes  2;   # phase 7: prove the mirror table is shared ACROSS workers
pid               logs/nginx.pid;
error_log         logs/error.log  info;

# framework first (publishes globalThis.mirror), then the transpiler
# (adds mirror.transpile), then the app rule
js_source         ../lib/mirror.js;
js_source         ../lib/transpile.js;
js_source         app.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    # two pools + trivial backends for the per-request LB-selection rule
    upstream mirror_poolA { server 127.0.0.1:9101; }
    upstream mirror_poolB { server 127.0.0.1:9102; }
    # one pool with two peers for the peer-level LB (onSelectPeer) rule
    upstream mirror_pool  { server 127.0.0.1:9101; server 127.0.0.1:9102; }
    server { listen 127.0.0.1:9101; location / { return 200 "backend-A\n"; } }
    server { listen 127.0.0.1:9102; location / { return 200 "backend-B\n"; } }

    server {
        # reuseport: per-connection kernel hashing spreads the phase-7 test's
        # close-connections across both workers, so the cross-worker table proof
        # is not at the mercy of the accept-mutex landing everything on one.
        listen       8300 reuseport;
        server_name  mirror-demo;

        location / { }

        # LB location: no JS content handler — proxy_pass is the content phase;
        # a mirror onRequestHeaders rule picks the pool via ev.selectUpstream().
        location /lb/ {
            set        $mirror_upstream mirror_poolA;
            proxy_pass http://$mirror_upstream;
        }

        # peer-level LB: a normal upstream; the custom balancer (onSelectPeer)
        # picks the peer per request, keeping upstream health/retry/accounting.
        location /lbpeer/ {
            proxy_pass http://mirror_pool;
        }

        # phase 11: a location served by a LIVE-TRANSPILED iRule (TCL -> mirror
        # at config time). app.js sets the content handler + applyRule().
        location /irule/ { }
    }

    # HTTPS server for the onClientHello (TLS ClientHello) rule.
    # cert.pem / key.pem are generated by test.sh.
    server {
        listen       8343 ssl;
        server_name  mirror-tls;

        ssl_certificate      cert.pem;
        ssl_certificate_key  key.pem;

        location / { }
    }
}

# raw-TCP (L4) server for the onClientData rule (iRules CLIENT_DATA).
# The JS handler is attached via mirror.attachStream(nginx.stream.servers[0], ...).
stream {
    server {
        listen 127.0.0.1:8402;
    }
}
