# P1 — a confined tenant serves real traffic.
#
# The ONLY js line is js_source.  No tenant directive exists: the host program
# admits the tenant with comcon.include() and binds it with location.handler.

worker_processes 1;
error_log logs/error.log notice;
pid logs/nginx.pid;

js_source host.js;

events { worker_connections 64; }

http {
    access_log off;
    server {
        listen 127.0.0.1:8200;
        location /t       { }    # the tenant, confined
        location /denials { }    # the host's report
    }
}
