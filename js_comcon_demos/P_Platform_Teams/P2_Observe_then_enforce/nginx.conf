# P2 — observe first, then enforce: the posture is a property of the BINDING.

worker_processes 1;
error_log logs/error.log notice;
pid logs/nginx.pid;

js_source host.js;

events { worker_connections 64; }

http {
    access_log off;
    server {
        listen 127.0.0.1:8201;
        location /postures { }    # one tenant, three postures, side by side
        location /learn    { }    # a greedy tenant, harvested in learn mode
        location /mode     { }    # ?set=enforce -- when the environment is settled
    }
}
