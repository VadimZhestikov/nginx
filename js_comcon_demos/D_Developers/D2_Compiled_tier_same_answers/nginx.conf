# D2 — the same fragment on the interpreter build and the compiled build.

worker_processes 1;
error_log logs/error.log notice;
pid logs/nginx.pid;

js_source host.js;

events { worker_connections 64; }

http {
    access_log off;
    server {
        listen 127.0.0.1:8211;
        location /run { }    # ?token=a.b.c
    }
}
