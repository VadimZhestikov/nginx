# O4 — onboard by evidence: record what the binding answers, pin it, rebind against it.

worker_processes 1;
error_log logs/error.log notice;
pid logs/nginx.pid;

js_source host.js;

events { worker_connections 64; }

http {
    access_log off;
    server {
        listen 127.0.0.1:8220;
        location /price { }   # the tenant's handler: ?sku=...&qty=...
        location /ops { }     # ?op=record | suite | coverage | guard | rehearse | rebind-bad | rebind-good | diff
    }
}
