# O3 — a policy change rehearses before it performs: diff, shadow, would-deny, flip.

worker_processes 1;
error_log logs/error.log notice;
pid logs/nginx.pid;

js_source host.js;

events { worker_connections 64; }

http {
    access_log off;
    server {
        listen 127.0.0.1:8216;
        location /diff      { }
        location /t         { }    # live traffic: the current binding + the shadowed candidate
        location /rehearsal { }
        location /perform   { }
    }
}
