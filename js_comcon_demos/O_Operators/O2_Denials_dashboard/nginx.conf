# O2 — the denials dashboard and the fleet posture switch.

worker_processes 1;
error_log logs/error.log notice;
pid logs/nginx.pid;

js_source host.js;

events { worker_connections 64; }

http {
    access_log off;
    server {
        listen 127.0.0.1:8209;
        location /dash  { }
        location /mode  { }    # ?set=enforce | audit | learn
        location /probe { }
    }
}
