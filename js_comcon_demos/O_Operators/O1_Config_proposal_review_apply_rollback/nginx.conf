# O1 — a tenant proposes config; the operator reviews, applies, rolls back.

worker_processes 1;
error_log logs/error.log notice;
pid logs/nginx.pid;

js_source host.js;

events { worker_connections 64; }

http {
    access_log off;
    upstream acme_backend { server 127.0.0.1:8258; }
    server {
        listen 127.0.0.1:8208;
        location /acme { proxy_pass http://acme_backend; }   # the tenant's subtree
        location /ctl  { }                                    # the operator's console
    }
}
