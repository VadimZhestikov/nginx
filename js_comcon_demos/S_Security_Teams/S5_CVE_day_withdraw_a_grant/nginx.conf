# S5 — CVE day: withdraw a grant while the tenant is serving, and follow the delegation.

worker_processes 1;
error_log logs/error.log notice;
pid logs/nginx.pid;

js_source host.js;

events { worker_connections 64; }

http {
    access_log off;
    server {
        listen 127.0.0.1:8219;
        location /api { }     # the tenant's handler: it calls the vendor library
        location /ops { }     # ?op=withdraw&grant=out | status | replace | audit | enforce | docs | offboard
    }
}
