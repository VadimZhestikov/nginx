# S4 — an authenticated principal becomes an environment (std.sessions).

worker_processes 1;
error_log logs/error.log notice;
pid logs/nginx.pid;

js_source host.js;

events { worker_connections 64; }

http {
    access_log off;
    server {
        listen 127.0.0.1:8207;
        location /session { }    # ?who=ci@acme | dev@acme | greedy@acme | nobody
        location /revoke  { }    # ?who=...
    }
}
