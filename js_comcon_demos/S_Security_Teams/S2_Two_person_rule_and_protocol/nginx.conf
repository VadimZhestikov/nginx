# S2 — cosign (who) and protocol (in what order).

worker_processes 1;
error_log logs/error.log notice;
pid logs/nginx.pid;

js_source host.js;

events { worker_connections 64; }

http {
    access_log off;
    server {
        listen 127.0.0.1:8205;
        location /attempt  { }    # ?who=alice | ?who=bob
        location /protocol { }
    }
}
