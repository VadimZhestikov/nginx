# S3 — reach outward as a capability: the fragment records intent, the host performs.

worker_processes 1;
error_log logs/error.log notice;
pid logs/nginx.pid;

js_source host.js;

events { worker_connections 64; }

http {
    access_log off;
    server {
        listen 127.0.0.1:8206;
        location /outbound { }
    }
}
