# A1 — the audit is a query: the trust report, the call-site query, the reviewable rewrite.

worker_processes 1;
error_log logs/error.log notice;
pid logs/nginx.pid;

js_source host.js;

events { worker_connections 64; }

http {
    access_log off;
    server {
        listen 127.0.0.1:8215;
        location /report  { }
        location /where   { }    # ?name=fetch
        location /rewrite { }    # ?op=harden | rollback
        location /v       { }    # the vendor binding, live
    }
}
