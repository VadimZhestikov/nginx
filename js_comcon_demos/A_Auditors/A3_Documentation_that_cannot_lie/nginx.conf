# A3 — documentation that cannot lie: the manual is a query over the contract.

worker_processes 1;
error_log logs/error.log notice;
pid logs/nginx.pid;

js_source host.js;

events { worker_connections 64; }

http {
    access_log off;
    server {
        listen 127.0.0.1:8218;
        location /docs   { }
        location /model  { }
        location /narrow { }
        location /acme   { }
    }
}
