# A2 — the five-minute vendor evaluation: the SDK's appetite, measured, not asserted.

worker_processes 1;
error_log logs/error.log notice;
pid logs/nginx.pid;

js_source host.js;

events { worker_connections 64; }

http {
    access_log off;
    server {
        listen 127.0.0.1:8217;
        location /evaluate { }
        location /paste    { }
    }
}
