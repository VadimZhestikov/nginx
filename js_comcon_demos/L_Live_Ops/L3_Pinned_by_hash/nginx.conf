# L3 — pinned by hash: a silently changed file is refused at admission.

worker_processes 1;
error_log logs/error.log notice;
pid logs/nginx.pid;

js_source host.js;

events { worker_connections 64; }

http {
    access_log off;
    server {
        listen 127.0.0.1:8214;
        location /source { }
        location /pin    { }    # ?identity=<pin>&drift=0|1
        location /dep    { }    # ?sha256=<hex>&path=<abs>
    }
}
