# L1 — patching a hot function at noon: epochs, rollback, tombstone, revive.

worker_processes 1;
error_log logs/error.log notice;
pid logs/nginx.pid;

js_source host.js;

events { worker_connections 64; }

http {
    access_log off;
    server {
        listen 127.0.0.1:8212;
        location /price { }    # ?qty=N — the live binding
        location /ctl   { }    # ?op=patch|rollback|remove|revive|describe|tier|stress
    }
}
