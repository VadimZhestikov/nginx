# L2 — one replace, four workers: the shared binding fans out coherently.

worker_processes 4;
error_log logs/error.log notice;
pid logs/nginx.pid;

js_source host.js;

events { worker_connections 64; }

http {
    access_log off;
    server {
        listen 127.0.0.1:8213;
        location /g   { }    # the shared binding, whichever worker answers
        location /ctl { }    # ?op=patch|remove|revive|epoch -- lands on ONE worker
    }
}
