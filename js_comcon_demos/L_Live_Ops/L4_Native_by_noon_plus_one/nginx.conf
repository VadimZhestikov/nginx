# L4 — a live epoch, compiled in the master, native on every worker without a reload.

worker_processes 2;
error_log logs/error.log notice;
pid logs/nginx.pid;

js_source host.js;

events { worker_connections 64; }

http {
    access_log off;
    server {
        listen 127.0.0.1:8221;
        location /score { }   # the tenant's handler, a shared binding
        location /ops { }     # ?op=replace | tier
    }
}
