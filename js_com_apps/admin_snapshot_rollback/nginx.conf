
# nginx.conf — base configuration for admin_snapshot_rollback demo.
#
# Start nginx from this directory:
#   nginx -c $(pwd)/nginx.conf -p $(pwd)
#
# The admin API is exposed at http://127.0.0.1:8090/admin/
# Application traffic is handled by http://127.0.0.1:8090/ (location /)

worker_processes  2;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source conf/admin.js;

events {
    worker_connections  1024;
}

http {
    default_type  application/octet-stream;
    access_log    logs/access.log;

    upstream backend {
        server  127.0.0.1:8091  weight=1;
        server  127.0.0.1:8092  weight=1;
    }

    server {
        listen       127.0.0.1:8090;
        server_name  localhost;

        # Admin API — snapshot / rollback
        location /admin/ { }

        # Application traffic (proxied to backend upstream)
        location / {
            proxy_pass  http://backend;
        }
    }
}
