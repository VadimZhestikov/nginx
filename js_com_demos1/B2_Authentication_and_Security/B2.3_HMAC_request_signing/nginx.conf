worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8137;
        server_name  localhost;

        # Signs the outgoing request and echoes what headers would be sent upstream
        location /sign/ { }
    }
}
