worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8136;
        server_name  localhost;

        # API endpoint — checks X-API-Key against the blocklist
        location /api/ { }

        # Admin endpoint — adds a key to the blocklist
        location /admin/revoke/ { }
    }
}
