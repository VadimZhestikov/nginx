worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8135;
        server_name  localhost;

        # Issues demo tokens (not production-safe — no real signature)
        location /admin/token/ { }

        # Validates Bearer token and returns the decoded claims
        location /protected/ { }
    }
}
