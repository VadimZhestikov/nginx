worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8144;
        server_name  localhost;

        # Routes to one of two backends based on session token hash
        location /sticky/ { }

        # Simulated backend A and B (internal, not reachable from outside)
        location /backend/a/ { internal; }
        location /backend/b/ { internal; }
    }
}
