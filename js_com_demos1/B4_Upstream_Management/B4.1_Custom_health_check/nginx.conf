worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  application/json;

    server {
        listen       8141;
        server_name  localhost;

        # Reports current health state as seen by the SharedWorker
        location /status/ { }

        # Simulated backend health endpoint (checked by the SW)
        location /_health/ { }

        # Admin: toggle health of a simulated peer
        location /admin/toggle/ { }
    }
}
