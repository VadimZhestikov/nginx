worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8180;
        server_name  localhost;

        # Unprotected health endpoint
        location /health/ { }

        # Protected API — requires valid Bearer token with admin role
        location /api/ { }

        # Protected admin area — requires admin role
        location /api/admin/ { }

        # Token mint — issues demo tokens for testing
        location /dev/token/ { }
    }
}
