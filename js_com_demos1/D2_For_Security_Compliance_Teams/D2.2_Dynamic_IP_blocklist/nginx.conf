worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8181;
        server_name  localhost;

        # Protected API — blocked IPs receive 403
        location /api/ { }

        # Admin: add an IP to the blocklist
        location /admin/block/ { }

        # Admin: remove an IP from the blocklist
        location /admin/unblock/ { }

        # Admin: list all blocked IPs
        location /admin/blocklist/ { }
    }
}
