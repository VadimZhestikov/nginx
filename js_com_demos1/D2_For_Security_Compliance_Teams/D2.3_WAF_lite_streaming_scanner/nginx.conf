worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8182;
        server_name  localhost;

        # POST endpoint — body scanned for injection patterns before processing
        location /api/submit/ { }

        # GET endpoint — returns current WAF rule count
        location /waf/rules/ { }
    }
}
