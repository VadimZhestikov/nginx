worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    # Admin server — handles listener management
    server {
        listen       8191;
        server_name  admin.local;

        # POST: register a new virtual hostname
        location /admin/listen/ { }

        # GET: show all registered virtual hosts and their info
        location /status/ { }
    }

    # Anchor server — required for vhost dispatch hash to exist at startup
    server {
        listen       8191;
        server_name  anchor.local;

        location /ping/ { }
    }
}
