worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8192;
        server_name  localhost;

        # Detection endpoint — routes based on client fingerprint
        location /detect/ { }

        # Internal backends
        location /internal/bot-backend/     { }
        location /internal/browser-backend/ { }
        location /internal/api-backend/     { }

        # Fingerprint stats
        location /status/ { }
    }
}
