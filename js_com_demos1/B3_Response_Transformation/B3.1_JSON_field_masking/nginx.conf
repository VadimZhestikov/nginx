worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  application/json;

    server {
        listen       8138;
        server_name  localhost;

        # Returns raw user data with sensitive fields — body filter masks them
        location /data/ { }
    }
}
