worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  application/json;

    server {
        listen       8140;
        server_name  localhost;

        # Aggregated product view — merges price + stock + rating
        location /product/ { }

        # Internal micro-endpoints (not reachable from outside)
        location /internal/price/   { internal; }
        location /internal/stock/   { internal; }
        location /internal/rating/  { internal; }
    }
}
