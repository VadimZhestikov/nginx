worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;
js_source         handler.js;

events { worker_connections 256; }

http {
    default_type  text/plain;

    server {
        listen       8164;
        server_name  localhost;

        location /data/ { }
        location /passthrough/ { }
    }
}
