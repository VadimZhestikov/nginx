worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8186;
        server_name  localhost;

        # Placeholder — full UI is in admin_ui_demo_v2
        location /status/ { }
        location /info/   { }
    }
}
