worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    # Static server 1 — the admin interface (port 8102)
    server {
        listen       8102;
        server_name  static1.local;

        location /add/    { }
        location /remove/ { }
        location /list/   { }
    }

    # Static server 2 — second server so nginx builds a vhost dispatch table,
    # which addServer() can then extend at runtime.
    server {
        listen       8102;
        server_name  static2.local;

        location /ping/ { }
    }
}
