worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;
js_source         handler.js;

events { worker_connections 256; }

http {
    default_type  application/json;

    server {
        listen       8161;
        server_name  localhost;

        location /merged/ { }
        location /internal/alpha/ { internal; }
        location /internal/beta/  { internal; }
        location /internal/gamma/ { internal; }
    }
}
