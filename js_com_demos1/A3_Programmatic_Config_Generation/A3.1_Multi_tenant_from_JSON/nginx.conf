worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

# js_preprocess runs the JS script during config parsing (before init_conf).
# The script calls config.write() to inject server{} blocks — no explicit
# server{} blocks are needed here; all are generated from tenants.json.
js_preprocess     gen.js;

events {
    worker_connections  256;
}
