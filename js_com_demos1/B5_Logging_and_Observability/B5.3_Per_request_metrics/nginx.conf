worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8150;
        server_name  localhost;

        # Measured API endpoint
        location /api/ { }

        # Prometheus-compatible metrics scrape endpoint
        location /metrics/ { }
    }
}
