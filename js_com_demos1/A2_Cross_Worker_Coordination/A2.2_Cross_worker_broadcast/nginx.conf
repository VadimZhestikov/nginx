worker_processes  2;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8109;
        server_name  localhost;

        location /config/        { }
        location /admin/update/  { }
        location /admin/delete/  { }
        location /worker-info/   { }
    }
}
