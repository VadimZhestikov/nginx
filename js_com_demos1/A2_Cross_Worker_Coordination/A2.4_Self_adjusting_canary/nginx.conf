worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8111;
        server_name  localhost;

        # Simulated backends (in-process for self-contained demo)
        location /backend/stable/  { }
        location /backend/canary/  { }

        # Traffic router — dispatches to stable or canary based on weight
        location /api/             { }

        # Admin: read/adjust canary weight and error counts
        location /admin/status/    { }
        location /admin/weight/    { }
        location /admin/report-error/ { }
    }
}
