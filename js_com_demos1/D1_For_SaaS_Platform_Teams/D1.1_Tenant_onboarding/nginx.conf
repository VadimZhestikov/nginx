worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    # Admin server — handles tenant provisioning
    server {
        listen       8175;
        server_name  admin.local;

        # POST /admin/tenants/ — create a new tenant virtual host
        location /admin/tenants/ { }

        # GET /status/ — list all known virtual hosts
        location /status/ { }
    }

    # Anchor server — second server on the same port so nginx builds the
    # vhost-dispatch hash at startup (addServer requires an existing hash).
    server {
        listen       8175;
        server_name  anchor.local;

        location /ping/ { }
    }
}
