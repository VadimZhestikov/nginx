worker_processes  2;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    server {
        listen       8176;
        server_name  localhost;

        # Public endpoint — routes to blue or green based on SAB flag
        location /app/ { }

        # Admin endpoint — toggles the active deployment
        location /admin/switch/ { }

        # Internal "blue" deployment backend
        location /internal/blue/ { }

        # Internal "green" deployment backend
        location /internal/green/ { }

        # Status — shows which deployment is currently active
        location /status/ { }
    }
}
