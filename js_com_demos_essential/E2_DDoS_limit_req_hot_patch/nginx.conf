worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  warn;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    # Shared rate-limit zone: 1 MB, initial rate 20 r/s — plenty of headroom
    # for normal traffic.  Under DDoS we tighten this at runtime.
    limit_req_zone  $binary_remote_addr  zone=public:1m  rate=20r/s;

    # Public API server (port 8202)
    server {
        listen       8202;
        server_name  api.example.com;

        location /api {
            limit_req        zone=public  burst=10  delay=5;
            limit_req_status 429;
        }
    }

    # Internal ops server — no rate-limit (port 8203)
    server {
        listen       8203;
        server_name  ops.internal;

        location /ddos/tighten  { }
        location /ddos/relax    { }
        location /ddos/status   { }
    }
}
