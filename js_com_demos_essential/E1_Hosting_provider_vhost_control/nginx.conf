worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log  info;

js_source         handler.js;

events {
    worker_connections  256;
}

http {
    default_type  text/plain;

    # Control-plane: tenant management API (port 8201)
    server {
        listen       8201;
        server_name  admin.internal;

        location /tenants/enable   { }
        location /tenants/disable  { }
        location /tenants/list     { }
    }

    # Anchor server — required so nginx builds a vhost-dispatch hash at
    # start-up that addServer() / removeServer() can extend at runtime.
    server {
        listen       8201;
        server_name  anchor.internal;

        location /health { }
    }
}
